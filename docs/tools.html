<!DOCTYPE html>
<html lang="en" data-theme="cyber">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Osien-Stack - Tool Explorer</title>
<link rel="icon" type="image/png" href="favicon-cyber.png">
<link rel="apple-touch-icon" href="apple-cyber.png">
<meta name="description" content="Browse all 45 osien-stack MCP tools with descriptions, categories and search.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --hue: 200; --sat: 75%; --light: 55%; --bg: hsl(var(--hue), 28%, 7%); --fg: hsl(var(--hue), 10%, 92%); --muted: hsl(var(--hue), 15%, 62%); --accent: hsl(var(--hue), var(--sat), var(--light)); --accent2: hsl(calc(var(--hue)+50), var(--sat), 60%); --card: hsla(var(--hue), 25%, 13%, .55); --border: hsla(var(--hue), 40%, 50%, .22); --glow: hsla(var(--hue), 80%, 60%, .3); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: auto; }
  body { font-family: 'Space Grotesk', system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; }
  
  .cursor { position: fixed; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); mix-blend-mode: difference; }
  .glow { position: fixed; width: 400px; height: 400px; border-radius: 50%; pointer-events: none; z-index: -1; background: radial-gradient(circle, var(--glow), transparent 70%); transform: translate(-50%,-50%); opacity: .6; mix-blend-mode: screen; }
  nav { position: sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:16px 28px;  background: hsla(var(--hue),25%,8%,.55); border-bottom:1px solid var(--border); }
  nav .logo { font-weight:800; font-size:1.2rem; font-family:'JetBrains Mono',monospace; display:flex; align-items:center; gap:8px; } nav .logo span { color: var(--accent); } nav .logo-img { height:28px; width:auto; border-radius:6px; }
  nav a { color: var(--fg); text-decoration:none; margin-left:20px; opacity:.8; font-size:.9rem; } nav a:hover { opacity:1; color: var(--accent); }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 40px 24px 80px; }
  h1 { font-size: clamp(2rem,5vw,3.4rem); font-weight:900; letter-spacing:-1.5px; margin-bottom: 8px; background: linear-gradient(120deg, var(--fg), var(--accent), var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { color: var(--muted); margin-bottom: 28px; font-size:1.05rem; }
  .toolbar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom: 24px; }
  .search { flex:1; min-width: 220px; padding: 12px 16px; border-radius: 12px; border:1px solid var(--border); background: var(--card); color: var(--fg); font-size:.95rem; outline:none; transition: border-color .2s, box-shadow .2s; }
  .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
  .filters { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { padding: 8px 14px; border-radius:999px; border:1px solid var(--border); background: var(--card); color: var(--muted); font-size:.85rem; cursor:pointer; transition: all .2s; user-select:none; }
  .chip:hover { color: var(--fg); border-color: var(--accent); }
  .chip.active { background: var(--accent); color:#0a0a0f; border-color:transparent; font-weight:600; }
  .meta { display:flex; gap:16px; margin-bottom: 20px; color: var(--muted); font-size:.9rem; }
  .meta strong { color: var(--accent); }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .tool { background: var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; transition: transform .42s cubic-bezier(.22,1,.36,1), box-shadow .3s ease, border-color .3s ease, opacity .42s ease-out; position:relative; overflow:hidden; opacity:0; transform: translateY(16px); }
  .tool.in { opacity:1; transform: translateY(0); }
  .tool:hover { transform: translateY(-4px); box-shadow: 0 16px 40px var(--glow); border-color: var(--accent); }
  .tool .name { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size:.95rem; color: var(--accent); font-weight:600; margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .tool .name .copy { font-size:.7rem; padding:3px 8px; border-radius:6px; border:1px solid var(--border); background:transparent; color: var(--muted); cursor:pointer; font-family:inherit; transition: all .2s; }
  .tool .name .copy:hover { color: var(--fg); border-color: var(--accent); }
  .tool .desc { color: var(--muted); font-size:.88rem; line-height:1.5; }
  .tool .cat { position:absolute; top:12px; right:12px; font-size:.65rem; padding:3px 8px; border-radius:999px; background: hsla(var(--hue),40%,25%,.5); color: var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .empty { text-align:center; padding:60px 20px; color: var(--muted); }
  .back { display:inline-flex; align-items:center; gap:6px; color: var(--accent); text-decoration:none; font-size:.9rem; margin-bottom:20px; }
  .back:hover { text-decoration:underline; }
  footer { text-align:center; padding:40px 24px; color: var(--muted); border-top:1px solid var(--border); font-size:.85rem; }
  footer a { color: var(--accent); text-decoration:none; }
  @media (max-width:600px){ .grid { grid-template-columns:1fr; } body { cursor: auto; } .cursor, .glow { display:none; } }
  .modal { position: fixed; inset: 0; z-index: 120; display: none; align-items: center; justify-content: center; background: rgba(4,4,10,.86); }
  .modal.open { display: flex; }
  .modal-box { width: min(520px, 92vw); background: hsla(var(--hue), 25%, 10%, .97); border: 1px solid var(--border); border-radius: 16px; padding: 28px; box-shadow: 0 40px 100px rgba(0,0,0,.6); }
  .modal-box .mname { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; color: var(--accent); margin-bottom: 10px; }
  .modal-box .mdesc { color: var(--muted); margin-bottom: 16px; font-size: .95rem; }
  .modal-box .mclose { float: right; background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .modal-box .mclose:hover { color: var(--fg); border-color: var(--accent); }
  .modal-box .mcat { display: inline-block; font-size: .68rem; padding: 3px 9px; border-radius: 999px; background: hsla(var(--hue),40%,25%,.5); color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }

@media (prefers-reduced-motion: reduce) {
    * { animation: none !important; animation-duration: .01ms !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
    .cursor, .glow { display: none !important; }
    nav::after, nav a::after, .tool::before, .tool::after, .chip::after, .modal.open .modal-box::after { display: none !important; }
  }
  /* OSIEN World tool explorer: same sharp cyber language as the home page. */
  html[data-theme="cyber"] { --hue: 318; --sat: 100%; --light: 60%; }
  html[data-theme="cyber"] body { background: #07030e; position: relative; isolation: isolate; }
  html[data-theme="cyber"] body::before { content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background: linear-gradient(hsla(185,90%,55%,.045) 1px, transparent 1px), linear-gradient(90deg, hsla(185,90%,55%,.045) 1px, transparent 1px),
      radial-gradient(900px 600px at 8% 0%, hsla(330,100%,52%,.18), transparent 65%), radial-gradient(800px 600px at 100% 100%, hsla(185,100%,48%,.14), transparent 65%);
    background-size: 46px 46px, 46px 46px, 100% 100%, 100% 100%; }
  html[data-theme="cyber"] body::after { content: ""; position: fixed; inset: 0; z-index: 8; pointer-events: none; opacity: .28;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px); }
  html[data-theme="cyber"] nav { background: rgba(7,3,14,.82); border-bottom-color: hsla(185,100%,55%,.28); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  html[data-theme="cyber"] nav .logo span, html[data-theme="cyber"] h1, html[data-theme="cyber"] .tool .name { font-family: 'Orbitron', 'Space Grotesk', sans-serif; }
  html[data-theme="cyber"] .wrap { padding-top: 56px; }
  html[data-theme="cyber"] h1 { text-transform: uppercase; letter-spacing: -2px; }
  html[data-theme="cyber"] .search, html[data-theme="cyber"] .chip, html[data-theme="cyber"] .tool, html[data-theme="cyber"] .modal-box { border-radius: 3px; }
  html[data-theme="cyber"] .tool { background: linear-gradient(145deg, rgba(20,8,32,.86), rgba(4,18,28,.76)); clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); }
  html[data-theme="cyber"] .tool:hover { box-shadow: 0 0 28px hsla(330,100%,60%,.22), inset 0 0 24px hsla(185,100%,55%,.05); }
  html[data-theme="cyber"] .chip.active { color: #07030e; box-shadow: 0 0 18px hsla(330,100%,60%,.35); }
  html[data-theme="cyber"] .back { text-transform: uppercase; letter-spacing: 1px; font-family: 'JetBrains Mono', monospace; font-size: .75rem; }
html[data-theme="cyber"] .modal-box { background: rgba(10,4,20,.97); box-shadow: 0 0 70px hsla(330,100%,60%,.18); }

  /* ===== minimalist high-motion layer: CSS only, no canvas / no deps ===== */
  @keyframes os-drift { from { transform: translate3d(0,0,0); } to { transform: translate3d(46px,46px,0); } }
  @keyframes os-breathe { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
  @keyframes os-flicker { 0%,100% { opacity: .2; } 50% { opacity: .34; } }
  @keyframes os-sheen { 0%,70% { background-position: 230% 0; } 90%,100% { background-position: -130% 0; } }
  @keyframes os-line { from { transform: translateX(-115%); } to { transform: translateX(330%); } }
  @keyframes os-scan { from { transform: translateY(-110%); } to { transform: translateY(320%); } }
  @keyframes os-rise { from { opacity: 0; transform: translateY(20px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes os-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes os-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); } 50% { box-shadow: 0 0 18px 2px hsla(330,100%,60%,.28); } }
  @keyframes os-focus { 0%,100% { box-shadow: 0 0 0 3px hsla(185,100%,55%,.16); } 50% { box-shadow: 0 0 0 6px hsla(330,100%,60%,.26); } }

  /* background: slow grid drift + breathing glow (transform/opacity only -> cheap) */
  html[data-theme="cyber"] body::before { inset: -60px; animation: os-drift 26s ease-in-out infinite alternate, os-breathe 11s ease-in-out infinite; }
  html[data-theme="cyber"] body::after { animation: os-flicker 8s ease-in-out infinite; }
  .glow { animation: os-breathe 6s ease-in-out infinite; }

  /* nav shimmer */
  nav::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 1px; width: 32%; pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--accent), hsla(185,100%,55%,.9), transparent);
    animation: os-line 6s cubic-bezier(.4,0,.2,1) infinite; }
  nav a { position: relative; }
  nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -5px; height: 1px; background: var(--accent);
    transform: scaleX(0); transform-origin: left; transition: transform .32s cubic-bezier(.22,1,.36,1); }
  nav a:hover::after, nav a:focus-visible::after { transform: scaleX(1); }

  /* card: animated sheen accent + hover edge, per-card stagger via nth-child */
  .tool::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(112deg, transparent 38%, hsla(185,100%,55%,.10) 46%, hsla(330,100%,60%,.16) 50%, hsla(185,100%,55%,.10) 54%, transparent 62%);
    background-size: 260% 100%; background-position: 230% 0; animation: os-sheen 11s ease-in-out infinite; }
  .tool:nth-child(3n+1)::after { animation-delay: -2.5s; }
  .tool:nth-child(3n+2)::after { animation-delay: -6s; }
  .tool:nth-child(3n)::after { animation-delay: -9s; }
  .tool::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, var(--accent), var(--accent2));
    transform: scaleY(0); transform-origin: top; transition: transform .38s cubic-bezier(.22,1,.36,1); }
  .tool:hover::before, .tool:focus-within::before { transform: scaleY(1); }
  .tool:hover .desc { color: var(--fg); }
  .tool .name .copy:active { transform: scale(.94); }

  /* chips + search microinteractions */
  .chip { position: relative; overflow: hidden; }
  .chip::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s;
    background: linear-gradient(100deg, transparent 40%, hsla(330,100%,70%,.22) 50%, transparent 60%);
    background-size: 250% 100%; background-position: 230% 0; }
  .chip:hover::after { opacity: 1; animation: os-sheen 1.4s ease-out forwards; }
  .chip:hover { transform: translateY(-1px); }
  .chip:active { transform: translateY(0) scale(.96); }
  .chip.active { animation: os-pulse 2.6s ease-in-out infinite; }
  .search:focus { animation: os-focus 1.7s ease-in-out infinite; }

  /* modal entrance: fade + rise + single scan pass */
  .modal-box { position: relative; overflow: hidden; }
  .modal.open { animation: os-fade .22s ease-out both; }
  .modal.open .modal-box { animation: os-rise .38s cubic-bezier(.22,1,.36,1) both; }
  .modal.open .modal-box::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 40%; pointer-events: none;
    background: linear-gradient(180deg, transparent, hsla(185,100%,55%,.10), transparent);
    animation: os-scan .7s cubic-bezier(.4,0,.2,1) both; }
</style>
</head>
<body>
  <div class="cursor" id="cursor"></div>
  <div class="glow" id="glow"></div>
  <nav>
    <div class="logo"><img src="logo-cyber.png" width="512" height="512" alt="Osien-Stack" class="logo-img"><span>osien_stack / tools</span></div>
    <div>
      <a href="index.html">World</a>
      <a href="https://github.com/kabirprokk/Osien-Stack" target="_blank">GitHub</a>
    </div>
  </nav>
  <div class="wrap">
    <a class="back" href="index.html">← Back to home</a>
    <h1>Tool Explorer</h1>
    <p class="sub">All 45 osien-stack MCP tools. Search, filter, copy the name. Your AI calls them by name.</p>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Search tools or descriptions…" autocomplete="off">
      <div class="filters" id="filters"></div>
    </div>
    <div class="meta" id="meta"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">No tools match your search.</div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <button class="mclose" id="mClose">close</button>
      <div class="mcat" id="mCat"></div>
      <div class="mname" id="mName"></div>
      <div class="mdesc" id="mDesc"></div>
      <button class="btn primary" id="mCopy" style="padding:10px 18px;font-size:.85rem">Copy tool name</button>
    </div>
  </div>
  <footer>Osien-Stack - MIT licensed - <a href="https://github.com/kabirprokk/Osien-Stack">GitHub</a></footer>

<script>
  const tools = [
    {"name":"ctx_recall","desc":"Load project memory by role/part/grep.","cat":"Memory"},
    {"name":"ctx_save","desc":"Persist memory: architecture/decisions/failures/state/performance.","cat":"Memory"},
    {"name":"soul_read","desc":"Read SOUL one-line notes.","cat":"Memory"},
    {"name":"soul_write","desc":"Append a SOUL flowchart line.","cat":"Memory"},
    {"name":"fast_note","desc":"Append a timestamped note.","cat":"Memory"},
    {"name":"task_state","desc":"Read/write task state.","cat":"Memory"},
    {"name":"state_reset","desc":"Clear task state.","cat":"Memory"},
    {"name":"smart_grep","desc":"Grep with file:line output, bounded.","cat":"Search"},
    {"name":"read_slice","desc":"Read file lines [start,end].","cat":"Search"},
    {"name":"impact_analyze","desc":"Find references to a symbol.","cat":"Search"},
    {"name":"machine_state","desc":"OS/CPU/mem/cwd snapshot.","cat":"State"},
    {"name":"repo_health","desc":"Git status + errors + memory.","cat":"State"},
    {"name":"project_map","desc":"Dirs, git, scripts, agents overview.","cat":"State"},
    {"name":"loop_status","desc":"Repeated actions/errors status.","cat":"State"},
    {"name":"checkpoint_create","desc":"Snapshot files for rollback.","cat":"State"},
    {"name":"verify_chain","desc":"Run format/typecheck/test/build.","cat":"Verify"},
    {"name":"security_scan","desc":"Scan for secrets/vulns.","cat":"Verify"},
    {"name":"test_gap","desc":"Find untested functions.","cat":"Verify"},
    {"name":"repro_capsule","desc":"Capture failing cmd + env.","cat":"Verify"},
    {"name":"context_budget","desc":"Token budget per file.","cat":"Verify"},
    {"name":"consensus","desc":"Multi-model consensus guidance.","cat":"Verify"},
    {"name":"auto_heal","desc":"Self-heal loop: detect/fix/verify.","cat":"Verify"},
    {"name":"rollback_on_failure","desc":"Rollback if verify fails.","cat":"Verify"},
    {"name":"perf_regression","desc":"Benchmark before/after.","cat":"Quality"},
    {"name":"test_synthesizer","desc":"Generate test stubs.","cat":"Quality"},
    {"name":"memory_compactor","desc":"Compress memory files.","cat":"Quality"},
    {"name":"dead_code_detector","desc":"Find unused exports.","cat":"Quality"},
    {"name":"dependency_graph","desc":"Mermaid dep graph.","cat":"Quality"},
    {"name":"changelog_generator","desc":"Generate changelog.","cat":"Quality"},
    {"name":"token_budget_enforcer","desc":"Enforce token budget.","cat":"Quality"},
    {"name":"architecture_drift","desc":"Compare docs vs code.","cat":"Quality"},
    {"name":"session_replay","desc":"Replay session timeline.","cat":"Quality"},
    {"name":"auto_document","desc":"Auto-generate docs.","cat":"Quality"},
    {"name":"feature_flag_manager","desc":"List feature flags.","cat":"Quality"},
    {"name":"license_checker","desc":"Check dep licenses.","cat":"Quality"},
    {"name":"schema_validator","desc":"Validate JSON files.","cat":"Quality"},
    {"name":"cost_estimator","desc":"Estimate token cost.","cat":"Quality"},
    {"name":"self_critique_loop","desc":"Self-critique guidance.","cat":"Quality"},
    {"name":"city_status","desc":"City agent status.","cat":"City"},
    {"name":"city_post","desc":"Post message between agents.","cat":"City"},
    {"name":"city_read","desc":"Read agent inbox.","cat":"City"},
    {"name":"city_broadcast","desc":"Broadcast to all agents.","cat":"City"},
    {"name":"city_mode","desc":"Activate city mode.","cat":"City"},
    {"name":"city_clear","desc":"Clear city mailbox.","cat":"City"},
    {"name":"batch","desc":"Run multiple ops in parallel in ONE call.","cat":"Parallel"}
  ];
  const cats = ["All", ...Array.from(new Set(tools.map(t=>t.cat)))];
  const filters = document.getElementById('filters');
  let activeCat = "All";
  cats.forEach(c => {
    const ch = document.createElement('div');
    ch.className = 'chip' + (c==='All'?' active':'');
    ch.textContent = c;
    ch.onclick = () => { activeCat = c; document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); ch.classList.add('active'); render(); };
    filters.appendChild(ch);
  });
  const grid = document.getElementById('grid');
  const search = document.getElementById('search');
  const meta = document.getElementById('meta');
  const empty = document.getElementById('empty');
  function render() {
    const q = search.value.trim().toLowerCase();
    const filtered = tools.filter(t => (activeCat==='All' || t.cat===activeCat) && (q==='' || t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q)));
    grid.innerHTML = '';
    filtered.forEach((t, i) => {
      const card = document.createElement('div');
      card.className = 'tool';
      card.innerHTML = '<div class="cat">' + t.cat + '</div><div class="name">' + t.name + '<button class="copy" data-name="' + t.name + '">copy</button></div><div class="desc">' + t.desc + '</div>';
      card.addEventListener('click', e => { if (e.target.classList.contains('copy')) return; openModal(t); });
      grid.appendChild(card);
      setTimeout(() => card.classList.add('in'), 30 + i*25);
    });
    empty.style.display = filtered.length ? 'none' : 'block';
    meta.innerHTML = 'Showing <strong>' + filtered.length + '</strong> of ' + tools.length + ' tools';
    grid.querySelectorAll('.copy').forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      navigator.clipboard.writeText(b.dataset.name);
      b.textContent = 'copied';
      setTimeout(() => b.textContent = 'copy', 1200);
    });
  }
  search.addEventListener('input', render);
  render();

  // ---------- tool modal ----------
  const modal = document.getElementById('modal');
  function openModal(t) {
    document.getElementById('mCat').textContent = t.cat;
    document.getElementById('mName').textContent = t.name;
    document.getElementById('mDesc').textContent = t.desc;
    document.getElementById('mCopy').onclick = () => { navigator.clipboard.writeText(t.name); document.getElementById('mCopy').textContent = 'Copied!'; setTimeout(() => document.getElementById('mCopy').textContent = 'Copy tool name', 1400); };
    modal.classList.add('open');
  }
  const deepTool = new URLSearchParams(location.search).get('tool');
  if (deepTool) {
    const match = tools.find(t => t.name === deepTool);
    if (match) { search.value = match.name; render(); openModal(match); }
  }
  document.getElementById('mClose').onclick = () => modal.classList.remove('open');
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
  window.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('open'); if (e.key === '/') { e.preventDefault(); document.getElementById('search').focus(); } });


  // cursor
  const cursor=document.getElementById('cursor');const glow=document.getElementById('glow'); if(cursor&&glow) document.body.style.cursor='none';let cx=0,cy=0,gx=0,gy=0,lcx=1e9,lcy=1e9,lgx=1e9,lgy=1e9;window.addEventListener('mousemove',e=>{cx=e.clientX;cy=e.clientY;},{passive:true});(function loop(){requestAnimationFrame(loop);if(document.hidden)return;gx+=(cx-gx)*.14;gy+=(cy-gy)*.14;if(Math.abs(cx-lcx)>.05||Math.abs(cy-lcy)>.05){lcx=cx;lcy=cy;cursor.style.transform='translate3d('+cx.toFixed(1)+'px,'+cy.toFixed(1)+'px,0) translate(-50%,-50%)';}if(Math.abs(gx-lgx)>.05||Math.abs(gy-lgy)>.05){lgx=gx;lgy=gy;glow.style.transform='translate3d('+gx.toFixed(1)+'px,'+gy.toFixed(1)+'px,0) translate(-50%,-50%)';}})();
  // scroll color
  const hues = [200, 260, 320, 140, 35, 200];
  window.addEventListener('scroll', () => requestAnimationFrame(() => {
    const y = window.scrollY; const max = document.body.scrollHeight - window.innerHeight;
    const progress = Math.min(1, Math.max(0, y/Math.max(1,max)));
    const idx = Math.min(hues.length-2, Math.floor(progress*(hues.length-1)));
    const local = progress*(hues.length-1) - idx;
    document.documentElement.style.setProperty('--hue', hues[idx] + (hues[idx+1]-hues[idx])*local);
  }), { passive:true });
</script>
</body>
</html>
